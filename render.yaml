# Despliegue del dashboard en Render (Blueprint). El código del dashboard está en dashboard_dcs/.
services:
  - type: web                                   # aplicación web
    name: proyecto-de-investigacion-ml-dcs      # nombre del servicio, da la URL pública
    runtime: python
    rootDir: dashboard_dcs                      # carpeta con la aplicación
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 600 --chdir src app:server
    plan: free                                  # el primer acceso puede tardar si el servicio estuvo inactivo
    envVars:
      - key: PYTHON_VERSION                     # fija la versión de Python
        value: 3.12.7
